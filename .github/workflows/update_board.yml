name: Update QB board

"on":
  schedule:
    # Tuesday 14:00 UTC: most of the previous week's games are final and FTN charting is mostly
    # caught up. Wednesday 14:00 UTC: a second pass that picks up any FTN charting that lagged.
    - cron: "0 14 * * 2"
    - cron: "0 14 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-board:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh the live board
        run: python update_board.py

      - name: Commit and push boards/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boards/
          if git diff --cached --quiet; then
            echo "No changes in boards/; nothing to commit."
          else
            git commit -m "Weekly board refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
